name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please provide details below.

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What type of feature is this?
      options:
        - New Tool (MCP tool)
        - API Enhancement
        - Performance Improvement
        - Developer Experience
        - Documentation
        - Testing
        - Security
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Critical - Needed for MVP
        - High - Important for next release
        - Medium - Nice to have soon
        - Low - Future enhancement
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: "As a [user type], I want to [goal] so that [benefit]"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work?
      placeholder: Describe your proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other solutions have you considered?

  - type: textarea
    id: examples
    attributes:
      label: Usage Examples
      description: Show how this feature would be used
      placeholder: |
        Example 1:
        User: "..."
        Assistant: [uses new tool] "..."

  - type: textarea
    id: technical
    attributes:
      label: Technical Considerations
      description: Any technical details, APIs, or implementation notes
      placeholder: |
        - API endpoint: /api/v2/example
        - Dependencies: package-name
        - Complexity: Medium

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: What's included in this feature?
      options:
        - label: New MCP tool(s)
        - label: API integration
        - label: Database changes
        - label: UI/UX changes (if applicable)
        - label: Documentation updates
        - label: Tests required

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How will we know this feature is complete?
      placeholder: |
        - [ ] Feature X works as expected
        - [ ] Tests pass
        - [ ] Documentation updated
